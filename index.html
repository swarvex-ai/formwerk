<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formwerk: parametric 3D assets as code</title>
    <meta name="description" content="Open library of parametric 3D assets for three.js: furniture, architecture and nature as code. Change the parameters, share the link, download a .glb. CC0." />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --grund: #0f1114; --flaeche: #16191d; --linie: #2a2f36; --text: #e8eaed; --leise: #9aa3ad; --akzent: #22d3ee; font: 15px/1.45 system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text); }
      body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "kopf kopf kopf" "liste buehne regler"; }
      #app { display: contents; }
      header { grid-area: kopf; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--linie); }
      header h1 { margin: 0; font-size: 1.3rem; } header p { margin: 0; color: var(--leise); flex: 1 1 320px; } a { color: var(--akzent); }
      .liste { grid-area: liste; overflow: auto; padding: 8px 12px; border-right: 1px solid var(--linie); }
      .liste h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); margin: 14px 0 6px; }
      .liste button { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 2px 0; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
      .liste button[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); }
      .buehne { grid-area: buehne; position: relative; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .werte { position: absolute; left: 12px; bottom: 8px; margin: 0; color: var(--leise); font: 12px ui-monospace, monospace; }
      .regler { grid-area: regler; overflow: auto; padding: 12px 16px; border-left: 1px solid var(--linie); }
      .regler h2 { margin: 4px 0; } .leise { color: var(--leise); } .klein { font-size: .85rem; }
      .feld { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin: 10px 0; }
      .feld label { grid-column: 1 / -1; font-size: .9rem; } .feld input[type=range] { width: 100%; } .feld output { font: 12px ui-monospace, monospace; color: var(--leise); }
      .feld select, .feld input[type=number] { grid-column: 1 / -1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; }
      .knoepfe { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
      .knoepfe button { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; cursor: pointer; }
      .knoepfe button:last-child { border-color: var(--akzent); color: var(--akzent); }
      @media (max-width: 860px) {
        body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 55vh auto; grid-template-areas: "kopf" "liste" "buehne" "regler"; height: auto; }
        .liste { display: flex; gap: 4px 12px; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--linie); }
        .liste section { display: contents; } .liste h2 { display: none; } .liste button { width: auto; }
        .regler { border-left: 0; }
      }
      body.test { display: block; } body.test .buehne { position: fixed; inset: 0; } body.test .werte { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="buehne"><canvas></canvas></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
