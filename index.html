<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formwerk: assets as code</title>
    <meta name="description" content="Open catalogue of assets as code for games, apps, teaching and research, built by the AI agents of the swarvex.ai swarm: parametric 3D models and tiling surfaces for three.js, PNG maps up to 8192 pixels, pixel sprites, interface icons and sounds for any engine. Change the parameters, share the link, download .glb, .png, .svg or .wav. CC0." />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; --grund: #0f1114; --flaeche: #16191d; --linie: #2a2f36; --text: #e8eaed; --leise: #9aa3ad; --akzent: #22d3ee; font: 15px/1.45 system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text); }
      body { display: grid; grid-template-columns: 220px minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "kopf kopf kopf" "liste buehne regler"; }
      #app { display: contents; }
      header { grid-area: kopf; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: baseline; padding: 12px 16px; border-bottom: 1px solid var(--linie); }
      header h1 { margin: 0; font-size: 1.3rem; } header p { margin: 0; color: var(--leise); flex: 1 1 320px; } a { color: var(--akzent); }
      .liste { grid-area: liste; overflow: auto; padding: 8px 12px; border-right: 1px solid var(--linie); }
      .liste h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); margin: 14px 0 6px; }
      .liste button { display: block; width: 100%; text-align: left; padding: 8px 10px; margin: 2px 0; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--text); font: inherit; cursor: pointer; }
      .liste button[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); }
      .buehne { grid-area: buehne; position: relative; min-height: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; } canvas[hidden] { display: none; } [hidden] { display: none !important; }
      .reiter { display: flex; flex-wrap: wrap; gap: 6px; }
      .reiter button { padding: 5px 14px; border-radius: 999px; border: 1px solid var(--linie); background: none; color: var(--text); font: inherit; cursor: pointer; }
      .reiter button[aria-current="true"] { border-color: var(--akzent); color: var(--akzent); }
      .knoepfe button.spielen { font-size: 1.05rem; padding: 10px 18px; min-width: 9em; }
      .werte { position: absolute; left: 12px; right: 12px; bottom: 8px; margin: 0; color: var(--leise); font: 12px ui-monospace, monospace; }
      .buehne:has(.klangbild:not([hidden])) .werte, .buehne:has(.spritebild:not([hidden])) .werte { top: 8px; bottom: auto; left: auto; padding: 2px 6px; border-radius: 4px; background: rgba(15, 17, 20, .75); }
      .regler { grid-area: regler; overflow: auto; padding: 12px 16px; border-left: 1px solid var(--linie); }
      .regler h2 { margin: 4px 0; } .leise { color: var(--leise); } .klein { font-size: .85rem; }
      .feld { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; margin: 10px 0; }
      .feld label { grid-column: 1 / -1; font-size: .9rem; } .feld input[type=range] { width: 100%; } .feld output { font: 12px ui-monospace, monospace; color: var(--leise); }
      .feld select, .feld input[type=number] { grid-column: 1 / -1; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; }
      .knoepfe { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
      .knoepfe button { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; cursor: pointer; }
      .regler h3 { margin: 18px 0 6px; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); }
      .feld small { grid-column: 1 / -1; color: var(--leise); font-size: .78rem; line-height: 1.35; }
      .looks { display: flex; flex-wrap: wrap; gap: 6px; }
      .looks button, .export button { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; cursor: pointer; }
      .export { display: grid; gap: 8px; margin-bottom: 24px; }
      .export select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; }
      .haken { display: flex; gap: 8px; align-items: flex-start; font-size: .85rem; color: var(--leise); } .haken[hidden] { display: none; }
      button.haupt { border-color: var(--akzent); color: var(--akzent); } button:disabled { opacity: .6; cursor: progress; }
      header .links { font-size: .9rem; color: var(--leise); }
      @media (max-width: 860px) {
        body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 55vh auto; grid-template-areas: "kopf" "liste" "buehne" "regler"; height: auto; }
        .liste { display: flex; gap: 4px 12px; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--linie); }
        .liste section { display: contents; } .liste h2 { display: none; } .liste button { width: auto; }
        .regler { border-left: 0; }
      }
      .iconbild { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 16px 36px; }
      .iconbild .karte { display: grid; grid-template-rows: 1fr auto; place-items: center; border-radius: 10px; border: 1px solid var(--linie); min-height: 0; }
      .iconbild .hell { background: #f6f7f9; } .iconbild .dunkel { background: #16191d; }
      .iconbild .gross svg { width: min(192px, 30vw); height: auto; display: block; }
      .iconbild .klein { display: flex; gap: 18px; align-items: end; padding: 12px; } .iconbild .klein svg { display: block; }
      .liste button.mitbild { display: flex; align-items: center; gap: 8px; } .liste button.mitbild svg { flex: none; }
      .buehne:has(.iconbild:not([hidden])) .werte { bottom: 10px; }
      @media (max-width: 860px) { .iconbild { grid-template-columns: 1fr; } }
      body.test { display: block; } body.test .buehne { position: fixed; inset: 0; } body.test .werte { display: none; }
      header h1 a.marke { color: inherit; text-decoration: none; }
      /* Start page (src/gallery/landing.ts): the gallery without a hash */
      body.zeigt-start { display: block; height: auto; }
      body.zeigt-start .liste, body.zeigt-start .regler, body.zeigt-start .buehne, body.zeigt-start header > p { display: none; }
      body.zeigt-start header { padding-inline: max(16px, calc((100% - 1120px) / 2 + 16px)); }
      .start { max-width: 1120px; margin: 0 auto; padding: 0 16px 40px; }
      .start a.knopf, .start button.knopf { display: inline-block; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--linie); background: var(--flaeche); color: var(--text); font: inherit; text-decoration: none; cursor: pointer; }
      .start a.knopf.haupt { background: var(--akzent); border-color: var(--akzent); color: #04252c; font-weight: 600; }
      .start .held { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: center; padding: 44px 0 8px; }
      .start .dach { margin: 0 0 10px; color: var(--leise); }
      .start .titel { margin: 0 0 16px; font-size: clamp(2.2rem, 5.2vw, 3.7rem); line-height: 1.04; letter-spacing: -.02em; }
      .start .einstieg { margin: 0 0 24px; font-size: 1.1rem; max-width: 34em; }
      .start .aktionen { display: flex; flex-wrap: wrap; gap: 10px; }
      .start .zahlen { margin: 18px 0 0; color: var(--leise); font-size: .9rem; }
      .start .mosaik { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .start .mosaik a { position: relative; display: block; overflow: hidden; border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); }
      .start .mosaik img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .25s; }
      .start .mosaik a:hover img, .start .mosaik a:focus-visible img { transform: scale(1.07); }
      .start .mosaik span { position: absolute; left: 8px; bottom: 6px; color: var(--leise); font-size: .78rem; }
      .start section > h2 { margin: 52px 0 16px; font-size: 1.5rem; }
      .start .arten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .start .karte { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--linie); border-radius: 10px; background: var(--flaeche); }
      .start .karte .bild { position: relative; height: 132px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--linie); border-radius: 8px; background: var(--flaeche); }
      .start .karte .bild > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
      .start .karte h3 { margin: 4px 0 0; font-size: 1.05rem; } .start .karte .zahl { color: var(--akzent); font-variant-numeric: tabular-nums; }
      .start .karte p { flex: 1; margin: 0; color: var(--leise); font-size: .92rem; }
      .start canvas.sprites { width: 100%; height: 100%; }
      .start .zeichen { display: flex; gap: 16px; color: var(--text); } .start .zeichen svg { width: 32px; height: 32px; }
      .start .klang { position: relative; width: 100%; height: 100%; } .start .klang img { display: block; width: 100%; height: 100%; opacity: .9; object-fit: cover; }
      .start button.anhoeren { position: absolute; right: 10px; bottom: 10px; padding: 6px 12px; border: 1px solid var(--akzent); border-radius: 999px; background: rgba(15, 17, 20, .8); color: var(--akzent); font: inherit; cursor: pointer; }
      .start .karte p.satz { flex: none; padding: 10px 14px; border: 1px solid var(--linie); border-radius: 14px 14px 14px 2px; color: var(--text); font-style: italic; }
      .start .breit { max-width: 46em; } .start .leise { color: var(--leise); }
      .start ol.schritte { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 18px 0; padding: 0; list-style: none; counter-reset: schritt; }
      .start ol.schritte li { padding: 14px; border-top: 2px solid var(--akzent); border-radius: 0 0 10px 10px; background: var(--flaeche); counter-increment: schritt; }
      .start ol.schritte li::before { content: counter(schritt); display: block; margin-bottom: 4px; color: var(--akzent); font-weight: 700; }
      .start ol.schritte h3, .start .spalten h3 { margin: 0 0 6px; font-size: 1rem; }
      .start ol.schritte p, .start .spalten p { margin: 0 0 8px; color: var(--leise); font-size: .92rem; }
      .start .spalten { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
      .start .spalten > div { padding: 14px; border: 1px solid var(--linie); border-radius: 10px; }
      .start footer { margin-top: 52px; padding-top: 16px; border-top: 1px solid var(--linie); color: var(--leise); font-size: .85rem; }
      @media (max-width: 860px) {
        .start .held { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 24px; }
        .start .arten, .start .spalten { grid-template-columns: minmax(0, 1fr); }
        .start ol.schritte { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 520px) { .start ol.schritte { grid-template-columns: minmax(0, 1fr); } .start .mosaik { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (prefers-reduced-motion: reduce) { .start .mosaik img { transition: none; } .start .mosaik a:hover img { transform: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="buehne"><canvas class="dreid"></canvas></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
