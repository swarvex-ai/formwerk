# Formwerk on swarvex: three.js environment (Node 24, Chromium for the scene tests). Protected paths: only the lead
# changes them (dependencies, the parameter contract, the test rules and the category limits).
template: threejs
test: npm test
preview: npm run build
preview_dir: dist
note: Every asset is a file in src/assets/<category>/ with a parameter schema (every parameter with describe), presets, physics hints, optional movable parts, a budget and a build function; read AGENTS.md and docs/style-guide.md. Scene baselines live in tests/scene/baseline/<id>.png and come with the asset; the scene test also bakes patterned assets and checks the .glb round trip.
protected: |
  - package.json
  - package-lock.json
  - src/core/**
  - src/assets/define.ts
  - src/catalog.ts
  - scripts/**
  - tests/core/**
  - tests/scene/run.mjs
