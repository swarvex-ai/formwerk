# Formwerk on swarvex: three.js environment (Node 24, Chromium for the scene tests). Protected paths: only the lead
# changes them (dependencies, the parameter contract, the test rules and the category limits).
template: threejs
test: node scripts/pipeline-test.mjs
preview: npm run build
preview_dir: dist
note: The catalogue of assets as code for games, apps, teaching and research. A model is a file in src/assets/<category>/, a surface a file in src/surfaces/<category>/, a sprite a file in src/sprites/<category>/, an icon a file in src/icons/<category>/, a sound a file in src/sounds/<category>/, each with a parameter schema (every parameter with describe), presets, a budget and a build function; read AGENTS.md and docs/style-guide.md. Reference images live in tests/scene/baseline/<id>.png and come with the asset: a render for a model, a render and its maps for a surface (it must tile), the sheet for a sprite or an icon (pixel-exact; an icon must read at 24 px and look the same as SVG in a browser), a spectrogram for a sound (agents cannot listen: describe the sound in words). The scene test also bakes patterned models and checks the .glb round trip.
protected: |
  - package.json
  - package-lock.json
  - src/core/**
  - src/assets/define.ts
  - src/sounds/define.ts
  - src/surfaces/define.ts
  - src/surfaces/noise.ts
  - src/surfaces/bake.ts
  - src/sprites/define.ts
  - src/icons/define.ts
  - src/catalog.ts
  - scripts/**
  - tests/core/**
  - tests/scene/run.mjs
  - tests/scene/sounds.mjs
  - tests/scene/sprites.mjs
  - tests/scene/icons.mjs
  - speech/**
