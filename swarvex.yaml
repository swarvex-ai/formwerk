# Formwerk on swarvex: three.js environment (Node 24, Chromium for the scene tests). Protected paths: only the lead
# changes them (dependencies, the parameter contract, the test rules and the category limits).
template: threejs
test: npm test
preview: npm run build
preview_dir: dist
note: The catalogue of game assets as code. A model is a file in src/assets/<category>/, a surface a file in src/surfaces/<category>/, a sound a file in src/sounds/<category>/, each with a parameter schema (every parameter with describe), presets, a budget and a build function; read AGENTS.md and docs/style-guide.md. Reference images live in tests/scene/baseline/<id>.png and come with the asset: a render for a model, a render and its maps for a surface (it must tile), a spectrogram for a sound (agents cannot listen: describe the sound in words). The scene test also bakes patterned models and checks the .glb round trip.
protected: |
  - package.json
  - package-lock.json
  - src/core/**
  - src/assets/define.ts
  - src/sounds/define.ts
  - src/surfaces/define.ts
  - src/surfaces/noise.ts
  - src/surfaces/bake.ts
  - src/catalog.ts
  - scripts/**
  - tests/core/**
  - tests/scene/run.mjs
  - tests/scene/sounds.mjs
